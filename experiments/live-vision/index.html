<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frontear · Live Vision</title>
<style>body{margin:0;background:#101624;color:#eef2ff;font:15px system-ui}main{max-width:920px;margin:auto;padding:20px}button,select{padding:10px;border-radius:9px;background:#273653;color:white;border:1px solid #566783;margin:4px}button:disabled{opacity:.5}.stage{position:relative;background:#030712;aspect-ratio:16/9;border-radius:14px;overflow:hidden}video,canvas{position:absolute;width:100%;height:100%;object-fit:contain}video.mirror,canvas.mirror{transform:scaleX(-1)}#status{padding:10px}#metrics{white-space:pre-wrap;color:#bcd0ee}small{color:#a9b5cb}</style></head>
<body><main><h1>Live Vision</h1><p>Локальное отслеживание рук для учебных приложений Frontear. Камера не отправляется на сервер.</p>
<div><button id="start">Включить камеру</button><button id="stop" disabled>Остановить</button><label><input id="mirror" type="checkbox" checked> Зеркально</label><select id="camera" aria-label="Камера"></select></div>
<div class="stage"><video id="video" autoplay playsinline muted></video><canvas id="overlay"></canvas></div>
<p id="status" role="status">Камера выключена</p><pre id="metrics"></pre><small>Экспериментальный трекинг: обнаружение точек рук не равно оценке правильности гитарной техники. Для оценки требуется калибровка грифа и сопоставление со звуком.</small></main>
<script type="module">
import {HandLandmarker,FilesetResolver,DrawingUtils} from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm';
const $=id=>document.getElementById(id), video=$('video'),canvas=$('overlay'),ctx=canvas.getContext('2d');
let stream=null,landmarker=null,active=false,lastTime=-1,frameId=0;
function status(s){$('status').textContent=s}
function mirror(){video.classList.toggle('mirror',$('mirror').checked);canvas.classList.toggle('mirror',$('mirror').checked)}
$('mirror').addEventListener('change',mirror);mirror();
async function devices(){const cams=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');$('camera').replaceChildren(...cams.map((d,i)=>{const o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||'Камера '+(i+1);return o}))}
async function initModel(){if(landmarker)return;status('Загрузка модели распознавания рук…');const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');landmarker=await HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'CPU'},runningMode:'VIDEO',numHands:2,minHandDetectionConfidence:.55,minTrackingConfidence:.55})}
async function stop(){active=false;cancelAnimationFrame(frameId);stream?.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;ctx.clearRect(0,0,canvas.width,canvas.height);$('start').disabled=false;$('stop').disabled=true;status('Камера выключена')}
async function start(){await stop();try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Нужен HTTPS или localhost');$('start').disabled=true;const id=$('camera').value;stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{deviceId:id?{ideal:id}:undefined,width:{ideal:1280},height:{ideal:720}}});video.srcObject=stream;await video.play();await devices();await initModel();active=true;$('stop').disabled=false;status('Отслеживание рук активно');loop()}catch(e){await stop();status('Ошибка: '+e.message)}}
function loop(){if(!active)return;if(video.readyState>=2&&video.currentTime!==lastTime){lastTime=video.currentTime;canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.clearRect(0,0,canvas.width,canvas.height);const r=landmarker.detectForVideo(video,performance.now()),draw=new DrawingUtils(ctx);for(const hand of r.landmarks){draw.drawConnectors(hand,HandLandmarker.HAND_CONNECTIONS,{color:'#64e7c0',lineWidth:3});draw.drawLandmarks(hand,{color:'#ffda75',radius:3})}const observations=r.landmarks.map((hand,i)=>({hand:r.handednesses[i]?.[0]?.categoryName??'unknown',confidence:Number((r.handednesses[i]?.[0]?.score??0).toFixed(2)),wrist:hand[0],indexTip:hand[8]}));$('metrics').textContent=JSON.stringify({hands:observations.length,observations},null,2);window.dispatchEvent(new CustomEvent('frontear:hand-landmarks',{detail:{timestamp:performance.now(),landmarks:r.landmarks,handedness:r.handednesses}}))}frameId=requestAnimationFrame(loop)}
$('start').addEventListener('click',start);$('stop').addEventListener('click',stop);$('camera').addEventListener('change',()=>{if(stream)start()});window.addEventListener('pagehide',stop);devices().catch(()=>{});
</script></body></html>
