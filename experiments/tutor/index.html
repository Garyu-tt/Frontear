<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frontear Tutor</title>
<style>
:root{font:16px system-ui;color-scheme:dark;background:#0f1422;color:#e8edf8}*{box-sizing:border-box}body{margin:0}main{max-width:1050px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:1.45rem}button,input{font:inherit;border-radius:10px;border:1px solid #495977;padding:12px;background:#202b41;color:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}input{min-width:0}#api{width:min(400px,100%)}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(220px,1fr);gap:16px}.panel{border:1px solid #34445e;border-radius:16px;padding:16px;background:#161e2e}#messages{height:55vh;min-height:310px;overflow:auto;display:flex;flex-direction:column;gap:12px}.message{padding:12px 14px;border-radius:14px;max-width:95%;white-space:pre-wrap;overflow-wrap:anywhere}.user{background:#324b75;align-self:flex-end}.assistant{background:#25344a;align-self:flex-start}form{display:flex;gap:8px;margin-top:12px}form input{flex:1}#concepts{display:flex;flex-direction:column;gap:8px}.concept{width:100%;text-align:left}.meta{color:#b0bfd8;font-size:.86rem}#status{min-height:1.5em}a{color:#a7caff}@media(max-width:720px){.layout{grid-template-columns:1fr}#messages{height:48vh}header{flex-wrap:wrap}}
</style></head><body><main><header><h1>Frontear · Tutor</h1><label>API <input id="api" value="http://localhost:8000" aria-label="Адрес API"></label></header><p class="meta">Открытый чат и граф знаний. Без регистрации. Интерфейс универсален для учебных проектов.</p><div class="layout"><section class="panel" aria-label="Чат"><div id="messages" role="log" aria-live="polite"><div class="message assistant">Привет! Напиши, что хочешь изучить, и я найду связанные темы и объяснения.</div></div><form id="form"><input id="question" required maxlength="2000" placeholder="Задай вопрос…" aria-label="Сообщение"><button id="send" type="submit">Отправить</button></form><p id="status" class="meta" role="status"></p></section><aside class="panel"><h2>Граф знаний</h2><div id="concepts"></div><h3>Материалы</h3><div id="videos" class="meta">Пока не выбрана тема</div></aside></div></main>
<script type="module">
const $=id=>document.getElementById(id), history=[];
const url=path=>$('api').value.trim().replace(/\/$/,'')+path;
function append(role,content){const el=document.createElement('div');el.className='message '+role;el.textContent=content;$('messages').append(el);$('messages').scrollTop=$('messages').scrollHeight}
function status(text){$('status').textContent=text}
function showVideos(items){const box=$('videos');box.replaceChildren();if(!items?.length){box.textContent='Проверенные видеоматериалы пока не добавлены';return}for(const v of items){const a=document.createElement('a');a.href=v.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=v.title+' ('+(v.start_seconds??0)+' с)';box.append(a,document.createElement('br'))}}
async function graph(){try{const response=await fetch(url('/api/v1/graph'));if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();const box=$('concepts');box.replaceChildren();for(const concept of data.concepts??[]){const b=document.createElement('button');b.className='concept';b.textContent=concept.title;b.onclick=()=>{const q=$('question');q.value='Объясни: '+concept.title;q.focus();};box.append(b)}status('Граф загружен: '+(data.concepts?.length??0)+' тем')}catch(e){status('Граф недоступен: '+e.message)}}
$('api').addEventListener('change',graph);
$('form').addEventListener('submit',async e=>{e.preventDefault();const message=$('question').value.trim();if(!message)return;$('question').value='';append('user',message);$('send').disabled=true;status('Подбираю объяснение…');try{const response=await fetch(url('/api/v1/chat'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,history:history.slice(-8)})});if(!response.ok)throw Error('HTTP '+response.status);const result=await response.json();append('assistant',result.answer);history.push({role:'user',content:message},{role:'assistant',content:result.answer});showVideos(result.videos);status((result.concepts?.length??0)+' связанных тем')}catch(error){append('assistant','Не удалось получить ответ: '+error.message);status('Проверь адрес API и доступность сервера')}finally{$('send').disabled=false;$('question').focus()}});
graph();
</script></body></html>
